AWSTemplateFormatVersion: "2010-09-09"
Description: Cloudrift audit role for organization accounts

Parameters:
  ManagementAccountId:
    Type: String
  ExternalId:
    Type: String

Resources:
  CloudriftAuditRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudriftAuditRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${ManagementAccountId}:role/CloudriftExecutionRole
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: CloudriftAuditPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  # Organization policy reads run with the management credential,
                  # which needs organizations:DescribeOrganization, ListRoots,
                  # ListParents, ListPoliciesForTarget, and DescribePolicy.
                  - organizations:ListAccounts
                  - organizations:ListParents
                  - organizations:ListTagsForResource
                  - organizations:DescribeOrganizationalUnit
                  - iam:ListRoles
                  - iam:GetAccountAuthorizationDetails
                  - iam:GenerateCredentialReport
                  - iam:GetCredentialReport
                  - iam:ListAccessKeys
                  - iam:GetAccessKeyLastUsed
                  - iam:GetUser
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:GetRolePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:GetInstanceProfile
                  - ec2:DescribeInstances
                  - ec2:DescribeIamInstanceProfileAssociations
                  - ec2:DescribeRegions
                  - ec2:DescribeSecurityGroups
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:DescribeTags
                  - rds:DescribeDBInstances
                  - lambda:ListFunctions
                  - ecs:ListClusters
                  - ecs:ListServices
                  - ecs:DescribeServices
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                  - ecs:DescribeTaskDefinition
                  - cloudformation:DescribeStacks
                  - codebuild:ListProjects
                  - codebuild:BatchGetProjects
                  - states:ListStateMachines
                  - states:DescribeStateMachine
                  - glue:GetDevEndpoints
                  - batch:DescribeJobDefinitions
                  - apprunner:ListServices
                  - apprunner:DescribeService
                  - sagemaker:ListNotebookInstances
                  - sagemaker:DescribeNotebookInstance
                  - bedrock-agentcore:ListAgentRuntimes
                  - bedrock-agentcore:GetAgentRuntime
                  - bedrock-agentcore:ListCodeInterpreters
                  - bedrock-agentcore:GetCodeInterpreter
                  - bedrock-agentcore:ListBrowsers
                  - bedrock-agentcore:GetBrowser
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeLaunchTemplateVersions
                  - autoscaling:DescribeAutoScalingGroups
                  - codedeploy:ListApplications
                  - codedeploy:ListDeploymentGroups
                  - codedeploy:BatchGetDeploymentGroups
                  - cloudtrail:LookupEvents
                  - eks:ListClusters
                  - eks:DescribeCluster
                  - eks:ListPodIdentityAssociations
                  - eks:DescribePodIdentityAssociation
                  - route53:ListHostedZones
                  - route53:ListResourceRecordSets
                  - cloudfront:ListDistributions
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:GetBucketWebsite
                  - s3:GetBucketPolicy
                  - s3:GetPublicAccessBlock
                  - s3:GetBucketOwnershipControls
                  - s3:GetBucketEncryption
                  - sts:AssumeRole
                Resource: "*"
