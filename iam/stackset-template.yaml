AWSTemplateFormatVersion: "2010-09-09"
Description: Cloudrift audit role for organization accounts

Parameters:
  ManagementAccountId:
    Type: String
  ExternalId:
    Type: String

Resources:
  CloudriftAuditRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudriftAuditRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${ManagementAccountId}:role/CloudriftExecutionRole
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: CloudriftAuditPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  # Organization policy reads run with the management credential,
                  # which needs organizations:DescribeOrganization, ListRoots,
                  # ListParents, ListPoliciesForTarget, and DescribePolicy.
                  - organizations:ListAccounts
                  - organizations:ListParents
                  - organizations:ListTagsForResource
                  - organizations:DescribeOrganizationalUnit
                  - iam:ListRoles
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:GetRolePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:GetInstanceProfile
                  - ec2:DescribeInstances
                  - ec2:DescribeIamInstanceProfileAssociations
                  - ec2:DescribeRegions
                  - lambda:ListFunctions
                  - ecs:ListClusters
                  - ecs:ListServices
                  - ecs:DescribeServices
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                  - ecs:DescribeTaskDefinition
                  - eks:ListClusters
                  - eks:DescribeCluster
                  - eks:ListPodIdentityAssociations
                  - eks:DescribePodIdentityAssociation
                  - route53:ListHostedZones
                  - route53:ListResourceRecordSets
                  - cloudfront:ListDistributions
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:GetBucketWebsite
                  - s3:GetBucketPolicy
                  - s3:GetPublicAccessBlock
                  - s3:GetBucketOwnershipControls
                  - s3:GetBucketEncryption
                  - sts:AssumeRole
                Resource: "*"
